location = /emporioJudaico {
    return 301 /emporioJudaico/$is_args$args;
}

location = /emporioJudaico/api {
    return 308 /emporioJudaico/api/$is_args$args;
}

location ^~ /emporioJudaico/api/ {
    proxy_pass http://127.0.0.1:3020/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
}

location ^~ /emporioJudaico/assets/ {
    root /docker/emporioJudaico/current;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ^~ /emporioJudaico/ {
    root /docker/emporioJudaico/current;
    index index.html;
    try_files $uri $uri/ /emporioJudaico/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}
