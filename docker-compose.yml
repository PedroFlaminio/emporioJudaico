services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emporio
      POSTGRES_USER: emporio
      POSTGRES_PASSWORD: emporio
    ports:
      - "5432:5432"
    volumes:
      - emporio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emporio -d emporio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  emporio_postgres:
